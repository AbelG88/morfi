<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Morfi Familiar</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mut:#64748b;--pri:#0d9488;--bd:#e2e8f0;--soft:#f1f5f9}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#24304a;--soft:#1a2540}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px 8px}
h1{font-size:17px;margin:0 0 8px}
.profs{display:flex;gap:6px;flex-wrap:wrap}
.pf{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.pf.on{color:#fff}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bar button,.btn,.sub button,.tf button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.btn{margin:0 6px 8px 0}
.day{padding:10px 12px}
.day.today{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.dn{font-weight:800;font-size:14px;margin-bottom:6px}
.slot{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--bd)}
.sl{width:70px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--mut);flex:none}
.sn{flex:1;font-size:14px;cursor:pointer}
.ic{border:none;background:var(--soft);border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--tx)}
.warn{background:#fef3c7;color:#78350f;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.pb{display:inline-block;color:#fff;border-radius:6px;font-size:11px;font-weight:800;padding:1px 6px;margin-right:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tf,.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tf button.on,.sub button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:10px}
.meal{cursor:pointer}
.meal b{display:block;margin-bottom:4px;font-size:15px}
.mut{color:var(--mut);font-size:12px}
.cat{font-weight:800;font-size:13px;margin:12px 0 4px}
.it{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:15px}
.it.done span{text-decoration:line-through;color:var(--mut)}
.it input{width:20px;height:20px;accent-color:var(--pri)}
.it .q{margin-left:auto;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;border:none;background:none;color:var(--mut);padding:10px 0 8px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:800}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.show{display:flex}
#mbox{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:85vh;overflow:auto}
.wheelwrap{position:relative;max-width:320px;margin:0 auto 10px}
.wheelwrap canvas{width:100%;height:auto;display:block}
.ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #dc2626;z-index:2}
.res{text-align:center}
.ok{color:#15803d;font-weight:700}
details{font-size:13px;color:var(--mut);margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>🥑 Morfi Familiar</h1>
  <div class="profs" id="profs"></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div id="mbox"></div></div>

<script src="data.js"></script>
<script>
/* ===================== DATOS (ver data.js) ===================== */
const CATS={C:'🥩 Carnes y pescados',V:'🥦 Verduras y frutas',L:'🥚 Lácteos y huevos',A:'🌾 Almacén y semillas'};
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const SLOTN={A:'Almuerzo',C:'Cena',M:'Merienda'};
const MEALS=buildData().MEALS;

/* ===================== ESTADO ===================== */
const store={
  get:function(k,d){try{var v=localStorage.getItem('morfi_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem('morfi_'+k,JSON.stringify(v));}catch(e){}}
};
const S={
  sel:store.get('sel',['a']),
  plans:store.get('plans',{}),
  checked:store.get('checked',{}),
  pantry:store.get('pantry',[]),
  excl:store.get('excl',{}),
  tab:'hoy',off:0,ctype:'T',q:'',hsub:'ruleta',htype:'A',hq:'',ptype:'T'
};
function save(){store.set('sel',S.sel);store.set('plans',S.plans);store.set('checked',S.checked);store.set('pantry',S.pantry);store.set('excl',S.excl);}
const $=function(s){return document.querySelector(s);};

/* ===================== UTILIDADES ===================== */
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fd(d){return d.getDate()+'/'+(d.getMonth()+1);}
function weekStart(o){var x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7)+(o===undefined?S.off:o)*7);return x;}
function isEx(id,k){return (S.excl[k]||[]).indexOf(id)>=0;}
function fitsSlot(m,slot){var o=m.ok[slot];return o!==undefined&&S.sel.every(function(t){return o.indexOf(t)>=0&&!isEx(m.id,t);});}
function fits(m,slot){if(slot&&slot!=='T')return fitsSlot(m,slot);return ['A','C','M'].some(function(s){return fitsSlot(m,s);});}
function pool(slot){return MEALS.filter(function(m){return fitsSlot(m,slot);});}
function okAll(m){var s='';['A','C','M'].forEach(function(x){(m.ok[x]||'').split('').forEach(function(c){if(s.indexOf(c)<0)s+=c;});});return s;}
function badges(m){var t=okAll(m);return PROFILES.filter(function(p){return t.indexOf(p.k)>=0;}).map(function(p){return '<span class="pb" style="background:'+p.c+'">'+p.n[0]+'</span>';}).join('');}
function fmtQ(q,u){
  if(u==='u')return Math.ceil(q-1e-9)+' u';
  if(u==='g'){var g=Math.ceil(q/10)*10;return g>=1000?(g/1000).toFixed(1).replace('.',',')+' kg':g+' g';}
  if(u==='ml'){var m=Math.ceil(q/10)*10;return m>=1000?(m/1000).toFixed(1).replace('.',',')+' l':m+' ml';}
  return Math.round(q)+' '+u;
}

/* ===================== PLAN SEMANAL ===================== */
function pkey(ws){return ws+'|'+S.sel.slice().sort().join('');}
function getPlan(ws){var k=pkey(ws);if(!S.plans[k]){S.plans[k]={seed:1,over:{}};save();}return S.plans[k];}
function weekMeals(ws){
  var p=getPlan(ws),out=[];
  ['A','C','M'].forEach(function(slot){
    var sh=shuffle(pool(slot),rng(hash(pkey(ws)+slot+p.seed)));
    for(var d=0;d<7;d++){
      var m=null,ov=p.over[d+slot];
      if(ov){m=MEALS.find(function(x){return x.id===ov;})||null;if(m&&!fitsSlot(m,slot))m=null;}
      if(!m&&sh.length)m=sh[d%sh.length];
      out.push({d:d,slot:slot,m:m});
    }
  });
  return out;
}
function regen(ws){var p=getPlan(ws);p.seed++;p.over={};save();render();}
function swap(ws,d,slot){
  var cur=weekMeals(ws).filter(function(x){return x.slot===slot;});
  var used={};cur.forEach(function(x){if(x.m)used[x.m.id]=1;});
  var me=cur.find(function(x){return x.d===d;}).m;
  var c=pool(slot).filter(function(m){return !used[m.id];});
  if(!c.length)c=pool(slot).filter(function(m){return !me||m.id!==me.id;});
  if(!c.length)return;
  getPlan(ws).over[d+slot]=c[Math.floor(Math.random()*c.length)].id;
  save();render();
}

/* ===================== COMPRAS ===================== */
function shopping(ws){
  var n=S.sel.length,map={};
  weekMeals(ws).forEach(function(x){
    if(!x.m)return;
    x.m.ings.forEach(function(i){
      var k=i.n+'|'+i.u;
      if(!map[k])map[k]={n:i.n,u:i.u,c:i.c,q:0};
      map[k].q+=i.q*n;
    });
  });
  return Object.keys(map).map(function(k){return map[k];});
}
function tick(key,v){if(v)S.checked[key]=1;else delete S.checked[key];save();viewCompras();}

/* ===================== MODAL ===================== */
function showMeal(id){
  var m=MEALS.find(function(x){return x.id===id;});if(!m)return;
  var n=S.sel.length;
  var h='<div class="bar"><b style="font-size:17px">'+m.name+'</b><button onclick="closeModal()">✕</button></div>';
  h+='<div style="margin-bottom:8px">'+badges(m)+' <span class="mut">'+(m.type==='AC'?'Almuerzo o cena':SLOTN[m.type])+'</span></div>';
  h+='<div class="mut" style="margin-bottom:6px">Ingredientes para '+n+' '+(n===1?'persona':'personas')+':</div>';
  m.ings.forEach(function(i){h+='<div class="it"><span>'+i.n+'</span><span class="q">'+fmtQ(i.q*n,i.u)+'</span></div>';});
  var tp=m.tip;if(S.sel.indexOf('d')>=0&&!tp)tp='Dante: sumar ralladito nutritivo (sésamo molido + levadura nutricional + queso) y ofrecerlo sin presionar.';
  if(tp)h+='<div class="card" style="margin-top:10px;background:var(--soft)">💡 '+tp+'</div>';
  $('#mbox').innerHTML=h;$('#modal').classList.add('show');
}
function closeModal(){$('#modal').classList.remove('show');}

/* ===================== VISTAS ===================== */
function viewSemana(){
  var ws=weekStart(),wsI=iso(ws),end=new Date(ws);end.setDate(end.getDate()+6);
  var wm=weekMeals(wsI),today=iso(new Date());
  var h='<div class="bar"><button onclick="S.off--;render()">‹</button><div style="text-align:center"><b>Semana del '+fd(ws)+' al '+fd(end)+'</b>'+(S.off===0?'<div class="mut">semana actual</div>':'')+'</div><button onclick="S.off++;render()">›</button></div>';
  var na=pool('A').length,nc=pool('C').length;
  if(na<7||nc<7)h+='<div class="warn">⚠️ Para esta combinación hay '+na+' almuerzos y '+nc+' cenas posibles, así que algunas comidas se repiten.</div>';
  h+='<button class="btn pri" onclick="regen(\''+wsI+'\')">🔄 Armar otra semana</button>';
  for(var d=0;d<7;d++){
    var dt=new Date(ws);dt.setDate(ws.getDate()+d);
    h+='<div class="card day'+(iso(dt)===today?' today':'')+'"><div class="dn">'+DAYS[d]+' '+fd(dt)+'</div>';
    ['A','C','M'].forEach(function(slot){
      var x=wm.find(function(y){return y.d===d&&y.slot===slot;});
      if(x&&x.m)h+='<div class="slot"><div class="sl">'+SLOTN[slot]+'</div><div class="sn" onclick="showMeal('+x.m.id+')">'+x.m.name+'</div><button class="ic" onclick="swap(\''+wsI+'\','+d+',\''+slot+'\')">🔄</button></div>';
      else h+='<div class="slot"><div class="sl">'+SLOTN[slot]+'</div><div class="sn mut">Sin opciones para esta combinación</div></div>';
    });
    h+='</div>';
  }
  $('#main').innerHTML=h;
}

function viewComidas(){
  var h='<div class="tf" id="tf"></div><input type="text" id="cq" placeholder="Buscar comida o ingrediente…" oninput="S.q=this.value;renderCList()" value="'+S.q.replace(/"/g,'')+'"><div class="mut" id="ccount" style="margin-bottom:8px"></div><div id="clist"></div>';
  h+=exclHTML()+critHTML();
  $('#main').innerHTML=h;renderTF('tf','ctype','renderCList',true);renderCList();
}
function askExcl(id){
  var m=MEALS.find(function(x){return x.id===id;});
  var h='<div class="bar"><b>🚫 Excluir: '+m.name+'</b><button onclick="closeModal()">✕</button></div><div class="mut" style="margin-bottom:8px">¿Para quién?</div>';
  PROFILES.forEach(function(p){h+='<label class="it"><input type="checkbox" class="exc" value="'+p.k+'" '+(S.sel.indexOf(p.k)>=0?'checked':'')+'><span>'+p.n+'</span></label>';});
  h+='<div style="margin-top:12px"><button class="btn pri" onclick="doExcl('+id+')">Excluir</button><button class="btn" onclick="closeModal()">Cancelar</button></div>';
  $('#mbox').innerHTML=h;$('#modal').classList.add('show');
}
function doExcl(id){
  var bs=document.querySelectorAll('.exc');
  for(var i=0;i<bs.length;i++){if(bs[i].checked){var k=bs[i].value;S.excl[k]=S.excl[k]||[];if(S.excl[k].indexOf(id)<0)S.excl[k].push(id);}}
  save();closeModal();newWheel();render();
}
function unExcl(id,k){S.excl[k]=(S.excl[k]||[]).filter(function(x){return x!==id;});save();newWheel();render();}
function exclHTML(){
  var h='',tot=0;
  PROFILES.forEach(function(p){
    var l=(S.excl[p.k]||[]).map(function(id){return MEALS.find(function(m){return m.id===id;});}).filter(Boolean);
    if(!l.length)return;tot+=l.length;
    h+='<div class="cat">'+p.n+' ('+l.length+')</div>'+l.map(function(m){return '<div class="it"><span>'+m.name+'</span><button class="ic" style="margin-left:auto" onclick="unExcl('+m.id+',\''+p.k+'\')">Restaurar</button></div>';}).join('');
  });
  return '<details><summary>🚫 Comidas excluidas ('+tot+')</summary>'+(h||'<p>Todavía no excluiste ninguna.</p>')+'</details>';
}
function critHTML(){
  var L=function(t,u){return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';};
  return '<details><summary>ℹ️ Criterios por persona (investigación)</summary>'+
  '<p><b>Abel</b> – plan bajo en carbohidratos y alto en grasa, sin gluten, sin legumbres ni maní; cenas sin vaca/cerdo; papa, batata y zapallo solo en almuerzos; fruta 1–2 por día, no de noche; cena antes de las 20:30–21.<br>'+
  '⚠️ Por el ácido úrico: se excluyen vísceras (hígado) y mariscos, y se prefieren lácteos, huevos, verduras y porciones moderadas de carne; evitar alcohol y azúcar/fructosa y tomar mucha agua ('+L('Mayo Clinic','https://www.mayoclinic.org/diseases-conditions/gout/in-depth/gout-diet/art-20048524')+'). Al empezar una dieta muy baja en carbohidratos el ácido úrico puede subir transitoriamente ('+L('Virta Health, fuente comercial','https://www.virtahealth.com/faq/keto-gout')+'): consultalo con tu médico o nutricionista.</p>'+
  '<p><b>Belén</b> – alimentos reales, sin gluten, ≥2 huevos por comida principal, legumbres y pseudocereales, fruta ≤2/día. No come carne ni pescado: solo huevo y lácteos. Cuidar hierro, B12 y proteína ('+L('Coeliac UK','https://www.coeliac.org.uk/')+').</p>'+
  '<p><b>Dante</b> – solo preparaciones simples y conocidas; se enriquece sin forzar (ralladito nutritivo, semillas molidas, pancitos, chipá), misma estrategia en ambas casas, 2,5 l de agua y bajar de a poco las galletitas dulces. Hoy acepta pocas cosas, casi todo rebozado; la idea es ir saliendo de eso de a poco con platos “puente” parecidos a lo que ya acepta ('+L('food chaining, Akron Children’s','https://www.akronchildrens.org/')+'). Sin presionar ni engañar.</p>'+
  '<p><b>Isa</b> – 8 años, come de todo y sin pauta propia: plan equilibrado según las Guías Alimentarias para la Población Argentina ('+L('GAPA','https://www.argentina.gob.ar/salud/alimentacion-saludable')+'): mitad verduras, proteínas, cereales integrales y agua. Cualquier comida sin vísceras.</p>'+
  '<p>Al elegir varias personas se muestran solo comidas que sirven a todas. Las reglas son automáticas por ingrediente y se pueden ajustar.</p></details>';
}
function renderTF(id,key,fn,all){
  var opts=(all?[['T','Todas']]:[]).concat([['A','Almuerzo'],['C','Cena'],['M','Merienda']]);
  $('#'+id).innerHTML=opts.map(function(o){return '<button class="'+(S[key]===o[0]?'on':'')+'" onclick="S.'+key+'=\''+o[0]+'\';'+(id==='tf'?'viewComidas()':id==='ptf'?'viewHoy()':'viewHoy()')+'">'+o[1]+'</button>';}).join('');
}
function renderCList(){
  var q=S.q.toLowerCase().trim();
  var l=MEALS.filter(function(m){
    if(!fits(m,S.ctype))return false;
    if(q&&(m.name.toLowerCase().indexOf(q)<0&&!m.ings.some(function(i){return i.n.toLowerCase().indexOf(q)>=0;})))return false;
    return true;
  });
  $('#ccount').textContent=l.length+' comidas para '+S.sel.map(function(k){return PROFILES.find(function(p){return p.k===k;}).n;}).join(' + ');
  $('#clist').innerHTML=l.map(function(m){return '<div class="card meal" onclick="showMeal('+m.id+')"><button class="ic" style="float:right;margin-left:8px" onclick="event.stopPropagation();askExcl('+m.id+')">🚫 Excluir</button><b>'+m.name+'</b>'+badges(m)+' <span class="mut">'+(m.type==='AC'?'Almuerzo o cena':SLOTN[m.type])+'</span></div>';}).join('')||'<div class="mut">No hay comidas que sirvan a todos los seleccionados con ese filtro.</div>';
}

function viewCompras(){
  var ws=iso(weekStart()),items=shopping(ws),total=items.length;
  var done=items.filter(function(i){return S.checked[ws+'|'+i.n+'|'+i.u];}).length;
  var h='<div class="bar"><b>🛒 Compras de la semana del '+fd(weekStart())+'</b><span class="mut">'+done+' / '+total+'</span></div>';
  h+='<button class="btn" onclick="copyList()">📋 Copiar lista</button><button class="btn" onclick="resetChecks()">Desmarcar todo</button>';
  h+='<div class="mut" style="margin:6px 0">Cantidades para '+S.sel.length+' '+(S.sel.length===1?'persona':'personas')+', según la semana armada. Reponer básicos: aceite de oliva, sal, especias.</div>';
  Object.keys(CATS).forEach(function(c){
    var l=items.filter(function(i){return i.c===c;}).sort(function(a,b){return a.n.localeCompare(b.n);});
    if(!l.length)return;
    h+='<div class="cat">'+CATS[c]+'</div>';
    l.forEach(function(i){
      var k=ws+'|'+i.n+'|'+i.u,ch=S.checked[k];
      h+='<label class="it'+(ch?' done':'')+'"><input type="checkbox" data-k="'+k+'" '+(ch?'checked':'')+' onchange="tick(this.dataset.k,this.checked)"><span>'+i.n+'</span><span class="q">'+fmtQ(i.q,i.u)+'</span></label>';
    });
  });
  $('#main').innerHTML=h;
}
function resetChecks(){var ws=iso(weekStart());Object.keys(S.checked).forEach(function(k){if(k.indexOf(ws+'|')===0)delete S.checked[k];});save();viewCompras();}
function copyList(){
  var ws=iso(weekStart()),items=shopping(ws),t='Compras semana del '+fd(weekStart())+'\n';
  Object.keys(CATS).forEach(function(c){
    var l=items.filter(function(i){return i.c===c;});
    if(!l.length)return;
    t+='\n'+CATS[c]+'\n'+l.map(function(i){return '- '+i.n+': '+fmtQ(i.q,i.u);}).join('\n')+'\n';
  });
  try{navigator.clipboard.writeText(t);}catch(e){}
}

/* ---------- HOY: ruleta + tengo en casa ---------- */
const wheel={items:[],rot:0,result:null,spinning:false};
function newWheel(){
  var p=pool(S.htype);
  wheel.items=shuffle(p,Math.random).slice(0,12);wheel.result=null;
}
function todayCard(){
  var ws=iso(weekStart(0)),wm=weekMeals(ws),d=(new Date().getDay()+6)%7,dt=new Date();
  var h='<div class="card day today"><div class="dn">📅 Hoy · '+DAYS[d]+' '+fd(dt)+'</div>';
  ['A','M','C'].forEach(function(slot){
    var x=wm.find(function(y){return y.d===d&&y.slot===slot;});
    if(x&&x.m)h+='<div class="slot"><div class="sl">'+SLOTN[slot]+'</div><div class="sn" onclick="showMeal('+x.m.id+')">'+x.m.name+'</div><button class="ic" onclick="swap(\''+ws+'\','+d+',\''+slot+'\')">🔄</button></div>';
    else h+='<div class="slot"><div class="sl">'+SLOTN[slot]+'</div><div class="sn mut">Sin opciones para esta combinación</div></div>';
  });
  return h+'<div class="mut" style="margin-top:6px">Tocá una comida para ver ingredientes · 🔄 para cambiarla</div></div>';
}
function viewHoy(){
  var h=todayCard()+'<div class="sub"><button class="'+(S.hsub==='ruleta'?'on':'')+'" onclick="S.hsub=\'ruleta\';newWheel();viewHoy()">🎡 Ruleta</button><button class="'+(S.hsub==='casa'?'on':'')+'" onclick="S.hsub=\'casa\';viewHoy()">🧺 Tengo en casa</button></div>';
  h+='<div class="tf" id="ptf"></div>';
  if(S.hsub==='ruleta'){
    h+='<div class="wheelwrap"><div class="ptr"></div><canvas id="wheel" width="600" height="600"></canvas></div>';
    h+='<div style="text-align:center;margin-bottom:10px"><button class="btn pri" onclick="spin()">🎲 ¡Girar!</button><button class="btn" onclick="newWheel();viewHoy()">Mezclar opciones</button></div><div class="res" id="wres"></div>';
  }else{
    h+='<input type="text" id="hq" placeholder="Buscar ingrediente…" oninput="S.hq=this.value;renderChips()" value="'+S.hq.replace(/"/g,'')+'"><div id="pchips"></div><div style="margin:10px 0"><button class="btn" onclick="S.pantry=[];save();viewHoy()">Limpiar</button></div><div id="pres"></div>';
  }
  $('#main').innerHTML=h;
  renderTF2();
  if(S.hsub==='ruleta'){drawWheel();showResult();}else{renderChips();renderRes();}
}
function renderTF2(){
  var opts=[['A','Almuerzo'],['C','Cena'],['M','Merienda']];
  if(S.hsub==='casa')opts.unshift(['T','Todas']);
  var key=S.hsub==='ruleta'?'htype':'ptype';
  $('#ptf').innerHTML=opts.map(function(o){return '<button class="'+(S[key]===o[0]?'on':'')+'" onclick="setHType(\''+o[0]+'\')">'+o[1]+'</button>';}).join('');
}
function setHType(t){if(S.hsub==='ruleta'){S.htype=t;newWheel();}else{S.ptype=t;}viewHoy();}
function drawWheel(){
  var cv=$('#wheel');if(!cv)return;
  var ctx=cv.getContext('2d'),W=cv.width,R=W/2-6,n=wheel.items.length;
  ctx.clearRect(0,0,W,W);
  if(!n){ctx.fillStyle='#94a3b8';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('Sin opciones',W/2,W/2);return;}
  var seg=2*Math.PI/n;
  for(var i=0;i<n;i++){
    var a=wheel.rot+i*seg;
    ctx.beginPath();ctx.moveTo(W/2,W/2);ctx.arc(W/2,W/2,R,a,a+seg);ctx.closePath();
    ctx.fillStyle='hsl('+Math.round(i*360/n)+',65%,52%)';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    ctx.save();ctx.translate(W/2,W/2);ctx.rotate(a+seg/2);
    ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 21px sans-serif';
    var nm=wheel.items[i].name;if(nm.length>20)nm=nm.slice(0,19)+'…';
    ctx.fillText(nm,R-14,7);ctx.restore();
  }
  ctx.beginPath();ctx.arc(W/2,W/2,24,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
}
function spin(){
  if(wheel.spinning||!wheel.items.length)return;
  wheel.spinning=true;wheel.result=null;showResult();
  var start=wheel.rot,extra=(5+Math.random()*3)*2*Math.PI,dur=4200,t0=performance.now();
  function f(t){
    var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    wheel.rot=start+extra*e;drawWheel();
    if(p<1)requestAnimationFrame(f);
    else{
      wheel.spinning=false;
      var n=wheel.items.length,seg=2*Math.PI/n,TWO=2*Math.PI;
      var ang=((-Math.PI/2-wheel.rot)%TWO+TWO)%TWO;
      wheel.result=wheel.items[Math.floor(ang/seg)%n];showResult();
    }
  }
  requestAnimationFrame(f);
}
function showResult(){
  var el=$('#wres');if(!el)return;
  var m=wheel.result;
  el.innerHTML=m?'<div class="card meal" onclick="showMeal('+m.id+')"><div class="mut">Hoy toca…</div><b style="font-size:18px">'+m.name+'</b>'+badges(m)+'<div class="mut" style="margin-top:6px">Tocá para ver ingredientes</div></div>':'';
}
function togglePantry(n){var i=S.pantry.indexOf(n);if(i>=0)S.pantry.splice(i,1);else S.pantry.push(n);save();renderChips();renderRes();}
function renderChips(){
  var q=S.hq.toLowerCase().trim(),map={};
  MEALS.forEach(function(m){m.ings.forEach(function(i){map[i.n]=i.c;});});
  var h='';
  Object.keys(CATS).forEach(function(c){
    var l=Object.keys(map).filter(function(n){return map[n]===c&&(!q||n.toLowerCase().indexOf(q)>=0);}).sort();
    if(!l.length)return;
    h+='<div class="cat">'+CATS[c]+'</div><div class="chips">'+l.map(function(n){return '<button class="chip'+(S.pantry.indexOf(n)>=0?' on':'')+'" data-n="'+n+'" onclick="togglePantry(this.dataset.n)">'+n+'</button>';}).join('')+'</div>';
  });
  $('#pchips').innerHTML=h;
}
function renderRes(){
  var el=$('#pres');if(!el)return;
  if(!S.pantry.length){el.innerHTML='<div class="mut">Marcá lo que tenés y te armo opciones de menú.</div>';return;}
  var l=MEALS.filter(function(m){return fits(m,S.ptype);}).map(function(m){
    var have=m.ings.filter(function(i){return S.pantry.indexOf(i.n)>=0;}).length;
    var miss=m.ings.filter(function(i){return S.pantry.indexOf(i.n)<0;}).map(function(i){return i.n;});
    return{m:m,have:have,miss:miss,r:have/m.ings.length};
  }).filter(function(x){return x.have>0;}).sort(function(a,b){return b.r-a.r||a.miss.length-b.miss.length;}).slice(0,15);
  el.innerHTML=l.length?l.map(function(x){
    return '<div class="card meal" onclick="showMeal('+x.m.id+')"><b>'+x.m.name+'</b>'+badges(x.m)+' '+(x.miss.length?'<span class="mut">Tenés '+x.have+' de '+x.m.ings.length+'</span><div class="mut">Te falta: '+x.miss.join(', ')+'</div>':'<span class="ok">✅ Tenés todo</span>')+'</div>';
  }).join(''):'<div class="mut">Con esos ingredientes no encuentro comidas para este perfil. Probá sumar más.</div>';
}

/* ===================== NAV / PERFILES ===================== */
function toggleProf(k){
  var i=S.sel.indexOf(k);
  if(i>=0){if(S.sel.length>1)S.sel.splice(i,1);}else S.sel.push(k);
  save();newWheel();render();
}
function renderHeader(){
  $('#profs').innerHTML=PROFILES.map(function(p){
    var on=S.sel.indexOf(p.k)>=0;
    return '<button class="pf'+(on?' on':'')+'" style="'+(on?'background:'+p.c+';border-color:'+p.c:'border-color:'+p.c)+'" onclick="toggleProf(\''+p.k+'\')">'+p.n+'</button>';
  }).join('');
}
const TABS=[['hoy','🎲','Hoy'],['semana','🗓️','Semana'],['comidas','🍽️','Comidas'],['compras','🛒','Compras']];
function renderNav(){
  $('#nav').innerHTML=TABS.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="S.tab=\''+t[0]+'\';render()"><span>'+t[1]+'</span>'+t[2]+'</button>';}).join('');
}
function render(){
  renderHeader();renderNav();
  if(S.tab==='semana')viewSemana();
  else if(S.tab==='comidas')viewComidas();
  else if(S.tab==='compras')viewCompras();
  else viewHoy();
  window.scrollTo(0,0);
}
newWheel();render();
</script>
</body>
</html>
